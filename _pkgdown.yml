template:
  bootstrap: 5
  math-rendering: mathjax
  light-switch: true
  bslib:
    bootswatch: yeti
  params:
    ganalytics: UA-123032895-1

deploy:
  install_metadata: true

url: https://ajaygpb.github.io/ammistability/

home:
  sidebar:
    structure:
      - links
      - license
      - community
      - citation
      - authors
      - dev

navbar:
  structure:
    left:  [home, reference, introduction, news]
    right: [search, github]
  components:
    home:
      icon: fa-home fa-lg
      text: Home
      href: index.html
    reference:
      icon: fa-code
      text: Reference
      href: reference/index.html
    introduction:
      icon: far fa-file
      text: Introduction
      href: articles/Introduction.html
    news:
      icon: far fa-newspaper
      text: News
      href: news/index.html
    github:
      icon: fab fa-github-alt
      text: Github
      href: https://github.com/ajaygpb/ammistability

reference:
    - title: Stability parameters
      contents:
         - '`AMGE.AMMI`'
         - '`ASI.AMMI`'
         - '`ASTAB.AMMI`'
         - '`AVAMGE.AMMI`'
         - '`DA.AMMI`'
         - '`DZ.AMMI`'
         - '`EV.AMMI`'
         - '`FA.AMMI`'
         - '`MASI.AMMI`'
         - '`MASV.AMMI`'
         - '`SIPC.AMMI`'
         - '`ZA.AMMI`'

    - title: Simultaneous selection index
      contents:
         - '`SSI`'

    - title: Wrapper function
      contents:
         - '`ammistability`'

    - title: Helper functions
      contents:
         - '`rankdf`'
         - '`rankslopegraph`'
